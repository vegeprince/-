<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7fb">
  <title>佛堂管理員後台｜安設佛堂之殊勝</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f4f6fb;color:#26364d;line-height:1.6}
    .header{background:linear-gradient(135deg,#253858,#667eea);color:#fff;text-align:center;padding:28px 16px}
    .header h1{margin:0;font-size:clamp(24px,4vw,32px)}
    .header p{margin:5px 0 0}
    .container{max-width:1200px;margin:auto;padding:26px 18px 60px}
    .panel{background:#fff;border-radius:20px;padding:24px;box-shadow:0 10px 35px rgba(0,0,0,.07)}
    .login{max-width:480px;margin:35px auto}
    h2{margin:0 0 16px;color:#253858}
    input{width:100%;padding:13px 15px;margin:0 0 14px;border:1px solid #dce4ef;border-radius:11px;font:inherit}
    button{border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:750;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}
    .primary{background:linear-gradient(135deg,#6279c9,#8060a9);color:white;width:100%}
    .dark{background:#253858;color:white}
    .gray{background:#64748b;color:white}
    .danger{background:#dc2626;color:white}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
    .toolbar h2{margin:0}
    .stats{color:#64748b;font-size:14px;margin-top:4px}
    .toolbar-actions{display:flex;gap:9px;flex-wrap:wrap}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
    .card{border:1px solid #e2e8f0;border-radius:16px;overflow:hidden;background:#fff}
    .photo{width:100%;height:230px;object-fit:cover;display:block;background:#eef1f5}
    .info{padding:16px}
    .name{font-size:21px;font-weight:850;color:#253858}
    .meta{margin-top:8px;color:#64748b;white-space:pre-wrap;overflow-wrap:anywhere}
    .date{font-size:12px;color:#94a3b8;margin-top:12px}
    .card-actions{display:flex;gap:8px;margin-top:14px}
    .card-actions button{flex:1}
    .message{text-align:center;color:#7b899d;padding:38px 15px;white-space:pre-wrap}
    .error{color:#dc2626;font-weight:700;margin-top:10px}
    .hidden{display:none!important}
    .note{font-size:13px;color:#64748b;margin:0 0 18px}
    @media(max-width:600px){.panel{padding:18px}.cards{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="header">
    <h1>🔐 佛堂管理員後台</h1>
    <p>安設佛堂之殊勝｜投稿管理中心</p>
  </header>

  <main class="container">
    <section id="loginSection" class="panel login">
      <h2>管理員登入</h2>
      <input type="email" id="email" placeholder="管理員 Email" autocomplete="username">
      <input type="password" id="password" placeholder="密碼" autocomplete="current-password">
      <button class="primary" id="loginBtn">登入管理後台</button>
      <div id="loginMessage" class="error" role="status"></div>
    </section>

    <section id="adminSection" class="panel hidden">
      <div class="toolbar">
        <div>
          <h2>🪷 佛堂投稿管理</h2>
          <div id="stats" class="stats">載入中……</div>
        </div>
        <div class="toolbar-actions">
          <button class="dark" id="refreshBtn">🔄 重新整理</button>
          <button class="gray" id="logoutBtn">登出</button>
        </div>
      </div>
      <p class="note">此頁與公開頁 fotang.html 共用 fotang_submissions 資料表及 fotang-photos 照片空間。投稿成功即公開，後台不另設審核狀態。</p>
      <div id="cards" class="cards"><div class="message">正在載入投稿……</div></div>
    </section>
  </main>

<script>
  const SUPABASE_URL = "https://mbojxcgoagsnkzwamwnw.supabase.co";
  const SUPABASE_KEY = "sb_publishable_ivX5hpbeoPLRZIygznbaXA_BB_Y6odx";
  const TABLE_NAME = "fotang_submissions";
  const ADMIN_EMAIL = "vegeprince@gmail.com";
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let submissions = [];
  let refreshTimer = null;
  let realtimeChannel = null;

  const $ = id => document.getElementById(id);
  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    })[ch]);
  }

  async function login() {
    const email = $("email").value.trim().toLowerCase();
    const password = $("password").value;
    $("loginMessage").textContent = "";
    if (!email || !password) {
      $("loginMessage").textContent = "請輸入管理員 Email 和密碼。";
      return;
    }
    if (email !== ADMIN_EMAIL) {
      $("loginMessage").textContent = "此帳號不是指定的管理員帳號。";
      return;
    }
    $("loginBtn").disabled = true;
    const { error } = await client.auth.signInWithPassword({ email, password });
    $("loginBtn").disabled = false;
    if (error) {
      $("loginMessage").textContent = "登入失敗：" + error.message;
      return;
    }
    await checkAdmin();
  }

  async function checkAdmin() {
    const { data: { user }, error: userError } = await client.auth.getUser();
    if (userError || !user || (user.email || "").toLowerCase() !== ADMIN_EMAIL) {
      await client.auth.signOut();
      showLogin();
      return;
    }
    // 以資料庫端 is_admin() RPC 驗證權限；前端 Email 檢查不能取代 RLS。
    const { data, error } = await client.rpc("is_admin");
    if (error || data !== true) {
      console.error("管理員權限驗證失敗：", error);
      alert("無法確認管理員權限。請確認 Supabase 的 is_admin() 函式及管理員角色設定。");
      await client.auth.signOut();
      showLogin();
      return;
    }
    $("loginSection").classList.add("hidden");
    $("adminSection").classList.remove("hidden");
    await loadSubmissions();
    startLiveSync();
  }

  async function loadSubmissions() {
    $("cards").innerHTML = '<div class="message">⏳ 正在載入佛堂投稿……</div>';
    const { data, error } = await client
      .from(TABLE_NAME)
      .select("id,name,offering,style,photo_url,is_approved,created_at")
      .order("created_at", { ascending: false })
      .limit(200);

    if (error) {
      console.error("載入投稿失敗：", error);
      $("stats").textContent = "資料讀取失敗";
      $("cards").innerHTML = `<div class="message">❌ 無法讀取 ${TABLE_NAME}\n${escapeHtml(error.message)}\n請確認資料表 SELECT RLS 政策允許管理員讀取。</div>`;
      return;
    }
    submissions = data || [];
    $("stats").textContent = `共 ${submissions.length} 筆投稿｜與公開分享頁共用同一資料來源`;
    renderSubmissions();
  }

  function renderSubmissions() {
    if (!submissions.length) {
      $("cards").innerHTML = '<div class="message">目前沒有佛堂投稿。</div>';
      return;
    }
    $("cards").innerHTML = submissions.map(item => {
      const photo = item.photo_url
        ? `<img class="photo" src="${escapeHtml(item.photo_url)}" alt="${escapeHtml(item.name)} 的佛堂照片" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'message',textContent:'照片載入失敗，請檢查 photo_url 與 Storage 檔案'}))">`
        : '<div class="message">此投稿沒有照片網址</div>';
      const created = item.created_at ? new Date(item.created_at).toLocaleString("zh-TW") : "時間未提供";
      return `<article class="card">
        ${photo}
        <div class="info">
          <div class="name">${escapeHtml(item.name)}</div>
          <div class="meta"><strong>供奉仙佛：</strong>${escapeHtml(item.offering)}</div>
          <div class="meta"><strong>擺設風格：</strong>${escapeHtml(item.style)}</div>
          <div class="date">投稿時間：${escapeHtml(created)}</div>
        </div>
      </article>`;
    }).join("");
  }

  function startLiveSync() {
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(loadSubmissions, 30000);
    if (realtimeChannel) client.removeChannel(realtimeChannel);
    realtimeChannel = client
      .channel("fotang-admin-sync")
      .on("postgres_changes", {
        event: "*", schema: "public", table: TABLE_NAME
      }, () => loadSubmissions())
      .subscribe();
  }

  async function logout() {
    if (refreshTimer) clearInterval(refreshTimer);
    if (realtimeChannel) client.removeChannel(realtimeChannel);
    refreshTimer = null;
    realtimeChannel = null;
    await client.auth.signOut();
    showLogin();
  }

  function showLogin() {
    $("adminSection").classList.add("hidden");
    $("loginSection").classList.remove("hidden");
  }

  $("loginBtn").addEventListener("click", login);
  $("refreshBtn").addEventListener("click", loadSubmissions);
  $("logoutBtn").addEventListener("click", logout);
  $("password").addEventListener("keydown", event => {
    if (event.key === "Enter") login();
  });

  // 若瀏覽器已有有效管理員 Session，直接驗證後進入。
  checkAdmin();
</script>
</body>
</html>
